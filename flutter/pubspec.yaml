name: quran_tafsir
description: Al Quran — Scientific Tafsir. Lightweight Flutter app with embedded SQLite, trilingual reading and knowledge pills.
publish_to: "none"
version: 2.2.0+28

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  just_audio: ^0.9.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/tafsir.db.gz
    - assets/quran_ar.json
    - assets/knowledge.json
    - assets/business.json
    - assets/words_export.json
    - assets/data/audio.json
    - assets/data/wbw/
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#F8F8F4"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 21
