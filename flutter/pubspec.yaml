name: quran_tafsir
description: Scientific Tafsir of the Quran — lightweight Flutter app with embedded SQLite.
publish_to: "none"
version: 2.0.0+20

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tafsir.db.gz
