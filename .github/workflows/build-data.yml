name: Build Data (knowledge, words, Arabic backfill + verify)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'knowledge/**'
      - 'assets/data/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'search.html'
      - 'words.html'
      - 'business.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install PDF extractor (poppler-utils)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Syntax check (JS + JSON)
        run: |
          for f in assets/js/*.js; do node --check "$f"; done
          for f in assets/data/*.json; do python -m json.tool "$f" > /dev/null; done
          python -m py_compile scripts/*.py
          echo "All syntax checks passed"

      - name: Validate word-by-word data + audio manifest (offline)
        run: |
          python scripts/build_wbw.py --check
          python scripts/build_audio.py --check

      - name: Extract knowledge books (txt / json / pdf)
        run: |
          python scripts/extract_knowledge.py --src knowledge --out assets/data/knowledge.json

      - name: Rebuild categorized word export (roots + ayah references)
        run: |
          python scripts/build_words_export.py

      - name: Build Arabic-only surah pages
        run: |
          python scripts/build_arabic_pages.py

      # Generators emit plain HTML; re-apply the CSP/referrer block they do not
      # know about and keep read pages at one copy of each script.
      - name: Re-apply browser security metadata
        run: |
          python scripts/apply_security_headers.py
          python scripts/normalize_read_pages.py

      - name: Sync generated data into the Flutter bundle
        run: |
          mkdir -p flutter/assets/data
          cp assets/data/quran_ar.json flutter/assets/data/quran_ar.json
          cp assets/data/knowledge.json flutter/assets/knowledge.json
          cp assets/data/business.json flutter/assets/business.json
          cp assets/data/words_export.json flutter/assets/words_export.json
          cp assets/data/audio.json flutter/assets/data/audio.json
          mkdir -p flutter/assets/data/wbw
          for f in assets/data/wbw/*.json; do
            gzip -n -9 -c "$f" > "flutter/assets/data/wbw/$(basename "$f").gz"
          done
          echo "wbw gz files: $(ls flutter/assets/data/wbw/*.gz | wc -l)"

      - name: Backfill Arabic Uthmani from bundled text (offline, SQLite)
        run: |
          python scripts/backfill_arabic_local.py

      - name: Validate regenerated bundle
        run: python scripts/validate_data.py

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git status --short
          fi

      - name: Commit & Push (if changed)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: refresh knowledge extracts, word categories and Arabic [skip ci]"
          git push
