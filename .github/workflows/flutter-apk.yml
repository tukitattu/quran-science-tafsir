name: Flutter APK (Android 10 → latest)

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.0.0) — leave empty for artifact-only build'
        required: false
        default: ''
  release:
    types: [created]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor (short)
        run: flutter doctor -v

      - name: Generate Android platform (minSdk 29 — Android 10)
        working-directory: flutter
        run: |
          flutter create . --platforms android --org com.etside --project-name quran_tafsir 2>&1 | tail -3
          # Android 10 floor (gradle DSL differs across AGP versions; handle both syntaxes)
          f=android/app/build.gradle.kts && [ -f "$f" ] || f=android/app/build.gradle
          sed -i "s/minSdk = .*/minSdk = 29/; s/minSdkVersion .*/minSdkVersion 29/" "$f"
          grep -n "minSdk" "$f"

      - name: Harden release build (keep plugin classes, no full-mode R8)
        working-directory: flutter
        run: |
          python3 - <<'PY'
          import pathlib
          g = pathlib.Path('android/gradle.properties')
          s = g.read_text()
          if 'android.enableR8.fullMode' not in s:
              g.write_text(s.rstrip() + '\nandroid.enableR8.fullMode=false\n')
          pathlib.Path('android/app/proguard-rules.pro').write_text(
              '-keep class io.flutter.plugins.sharedpreferences.** { *; }\n'
              '-keep class androidx.datastore.** { *; }\n'
              '-keep class com.dexterous.flutterlocalnotifications.** { *; }\n'
              '-keep class io.flutter.plugins.sqflite.** { *; }\n'
              '# Pigeon ProxyApi calls these from Dart via JNI using hard-coded\n'
              '# signatures that contain kotlin.coroutines.Continuation - R8 must\n'
              '# never rename the class or the lookup fails with NoSuchMethodError.\n'
              '-keepnames class kotlin.coroutines.Continuation\n'
              '-keep class kotlin.coroutines.** { *; }\n'
          )
          p = pathlib.Path('android/app/build.gradle.kts')
          kts = p.exists()
          if not kts:
              p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          if kts:
              s = s.replace(
                  'release {',
                  'release {\n'
                  '            isMinifyEnabled = false\n'
                  '            isShrinkResources = false\n'
                  '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                  1,
              )
          else:
              s = s.replace(
                  'release {',
                  'release {\n'
                  '            minifyEnabled false\n'
                  '            shrinkResources false\n'
                  "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'",
                  1,
              )
          p.write_text(s)
          print('minify disabled in', p)
          PY
          grep -n "MinifyEnabled\|minifyEnabled\|enableR8" android/app/build.gradle* android/gradle.properties

      - name: Patch permissions + app label (notifications, alarms, boot)
        working-directory: flutter
        run: |
          f=android/app/src/main/AndroidManifest.xml
          python3 - "$f" <<'EOF'
          import sys, pathlib, re
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          add = (
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
          )
          if 'POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', add + '    <application')
          s = re.sub(r'android:label="[^"]*"', 'android:label="Al Quran - Scientific Tafsir"', s, count=1)
          # Old Mali/Adreno drivers occasionally render a black frame with
          # Impeller; Skia is plenty for a text-first reader.
          if 'EnableImpeller' not in s:
              s = s.replace(
                  '    </application>',
                  '        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n    </application>',
              )
          p.write_text(s)
          print('manifest label patched:', 'Al Quran - Scientific Tafsir' in p.read_text())
          EOF

      - name: Enable core-library desugaring (required by flutter_local_notifications)
        working-directory: flutter
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          kts = p.exists()
          if not kts:
              p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          if 'coreLibraryDesugaring' in s:
              print('desugaring already enabled')
              raise SystemExit(0)
          if 'compileOptions {' not in s:
              print('!! compileOptions block not found in', p)
              raise SystemExit(1)
          if kts:
              s = s.replace('compileOptions {',
                            'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              dep = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")'
          else:
              s = s.replace('compileOptions {',
                            'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              dep = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
          s = s.rstrip() + '\n\ndependencies {\n' + dep + '\n}\n'
          p.write_text(s)
          print('patched', p)
          print(s)
          EOF

      - name: Add notification receivers to the manifest
        working-directory: flutter
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'ScheduledNotificationReceiver' not in s:
              recv = (
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                  '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
              )
              s = s.replace('    </application>', recv + '    </application>')
              p.write_text(s)
          print('receivers present:', 'ScheduledNotificationReceiver' in p.read_text())
          EOF

      - name: flutter analyze
        working-directory: flutter
        run: flutter pub get && flutter analyze --no-fatal-infos

      - name: Generate launcher icons (emblem from assets/icon.png)
        working-directory: flutter
        run: dart run flutter_launcher_icons

      - name: flutter test (if any)
        working-directory: flutter
        run: flutter test --no-pub

      - name: Pin release signing key (stable across builds)
        working-directory: flutter
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import base64, os, pathlib
          b64 = os.environ.get('ANDROID_KEYSTORE_BASE64', '').strip()
          if not b64:
              print('!! ANDROID_KEYSTORE_BASE64 missing - falling back to debug signing')
              raise SystemExit(0)
          ks = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release.p12'
          ks.write_bytes(base64.b64decode(b64))
          pw = os.environ['ANDROID_KEYSTORE_PASSWORD']
          alias = os.environ['ANDROID_KEY_ALIAS']
          kp = os.environ['ANDROID_KEY_PASSWORD']
          p = pathlib.Path('android/app/build.gradle.kts')
          kts = p.exists()
          if not kts:
              p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          if 'create("release")' in s or 'signingConfigs.release' in s:
              print('release signing already configured')
              raise SystemExit(0)
          if kts:
              block = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  f'            storeFile = file("{ks}")\n'
                  '            storeType = "PKCS12"\n'
                  f'            storePassword = "{pw}"\n'
                  f'            keyAlias = "{alias}"\n'
                  f'            keyPassword = "{kp}"\n'
                  '        }\n'
                  '    }\n'
              )
              s = s.replace('android {', 'android {\n' + block, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
          else:
              block = (
                  '    signingConfigs {\n'
                  '        release {\n'
                  f'            storeFile file("{ks}")\n'
                  '            storeType "PKCS12"\n'
                  f'            storePassword "{pw}"\n'
                  f'            keyAlias "{alias}"\n'
                  f'            keyPassword "{kp}"\n'
                  '        }\n'
                  '    }\n'
              )
              s = s.replace('android {', 'android {\n' + block, 1)
              s = s.replace('signingConfig signingConfigs.debug',
                            'signingConfig signingConfigs.release')
          p.write_text(s)
          print('release signing wired into', p)
          EOF

      - name: Build release APK (split per ABI, lightweight)
        working-directory: flutter
        run: |
          flutter build apk --release --split-per-abi --no-shrink
          ls -la build/app/outputs/flutter-apk/

      - name: Verify Pigeon/JNI plugin signatures survived (guard against R8 renaming Continuation)
        working-directory: flutter
        run: |
          python3 - <<'PY'
          import struct, sys, zipfile

          def uleb(b, o):
              v = s = 0
              while True:
                  c = b[o]; o += 1; v |= (c & 0x7F) << s
                  if not (c & 0x80):
                      break
                  s += 7
              return v, o

          WANTED = {
              'Lio/flutter/plugins/sharedpreferences/SharedPreferencesApiRegistrar;',
              'Lio/flutter/plugins/sharedpreferences/LegacySharedPreferencesPlugin;',
          }
          REQ = 'Lkotlin/coroutines/Continuation;'

          def check(apk):
              bad = []
              z = zipfile.ZipFile(apk)
              for name in sorted(x for x in z.namelist() if x.startswith('classes') and x.endswith('.dex')):
                  d = z.read(name)
                  g = lambda off: struct.unpack_from('<I', d, off)[0]
                  str_off, typ_off, proto_off, meth_off, cls_off = g(60), g(68), g(76), g(92), g(100)
                  typ_n, meth_n, cls_n = g(64), g(88), g(96)
                  def st(i):
                      o = g(str_off + i * 4); _, o = uleb(d, o)
                      return d[o:d.index(b'\x00', o)].decode('utf8', 'replace')
                  types = [st(g(typ_off + i * 4)) for i in range(typ_n)]
                  def desc(pi):
                      ret = types[g(proto_off + pi * 12 + 4)]
                      p = g(proto_off + pi * 12 + 8)
                      ps = [types[struct.unpack_from('<H', d, p + 4 + i * 2)[0]] for i in range(g(p))] if p else []
                      return f"({''.join(ps)}){ret}"
                  meth = {}
                  for i in range(meth_n):
                      ci, pi = struct.unpack_from('<HH', d, meth_off + i * 8)
                      meth[i] = (types[ci], st(g(meth_off + i * 8 + 4)), desc(pi))
                  for c in range(cls_n):
                      t = types[g(cls_off + c * 32)]
                      if t not in WANTED:
                          continue
                      data = g(cls_off + c * 32 + 24)
                      if not data:
                          continue
                      o = data
                      nsf, o = uleb(d, o); nif, o = uleb(d, o); ndm, o = uleb(d, o); nvm, o = uleb(d, o)
                      for _ in range(nsf + nif):
                          _, o = uleb(d, o); _, o = uleb(d, o)
                      for sect, nn in (('direct', ndm), ('virtual', nvm)):
                          mi = 0
                          for _ in range(nn):
                              dd, o = uleb(d, o); mi += dd; acc, o = uleb(d, o); code, o = uleb(d, o)
                              _, cn, cd = meth[mi]
                              if cn == 'getAll' and sect == 'virtual':
                                  short = t.split('/')[-1][:-1]
                                  if REQ not in cd or not code:
                                      bad.append(f'{short}.getAll{cd}')
                                  else:
                                      print(f'  OK {short}.getAll{cd}')
              return bad

          import glob
          all_bad = []
          for apk in sorted(glob.glob('build/app/outputs/flutter-apk/*-release.apk')):
              print(apk)
              all_bad += check(apk)
          if all_bad:
              print('BROKEN JNI signatures (R8 renamed kotlin.coroutines.Continuation?):')
              for b in all_bad:
                  print('  ', b)
              sys.exit(1)
          print('all Pigeon/JNI getAll signatures intact')
          PY

      - name: Upload pubspec.lock (dependency pinning)
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: flutter/pubspec.lock
          retention-days: 5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-tafsir-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/*release*.apk
          retention-days: 30

      - name: Attach API-level info
        run: echo "minSdk=29 (Android 10) · targetSdk=35 — supports Android 10 through 15+"

      - name: Attach to GitHub Release
        if: inputs.release_tag != '' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: flutter/build/app/outputs/flutter-apk/*release*.apk
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
