name: Flutter APK (Android 10 → latest)

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.0.0) — leave empty for artifact-only build'
        required: false
        default: ''
  release:
    types: [created]

# Least privilege: only release assets need write access.
permissions:
  contents: write

# Cancel stale runs on the same ref; never let a build hang forever.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to full commit SHAs (supply-chain safety).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor (short)
        run: flutter doctor -v

      - name: Generate Android platform (minSdk 29 — Android 10)
        working-directory: flutter
        run: |
          flutter create . --platforms android --org com.etside --project-name quran_tafsir 2>&1 | tail -3
          # Android 10 floor (gradle DSL differs across AGP versions; handle both syntaxes)
          f=android/app/build.gradle.kts && [ -f "$f" ] || f=android/app/build.gradle
          sed -i "s/minSdk = .*/minSdk = 29/; s/minSdkVersion .*/minSdkVersion 29/" "$f"
          grep -n "minSdk" "$f"

      - name: Harden Android manifest + network/backup policy
        working-directory: flutter
        run: |
          python3 - <<'PY'
          import pathlib, re
          app = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = app.read_text()

          # --- permissions -------------------------------------------------
          # Reminders are scheduled inexact, so no SCHEDULE_EXACT_ALARM:
          # fewer permissions, no Play Store exact-alarm policy review.
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
              '    <queries>\n'
              '        <intent>\n'
              '            <action android:name="android.intent.action.VIEW"/>\n'
              '            <data android:scheme="https"/>\n'
              '        </intent>\n'
              '    </queries>\n'
          )
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', perms + '    <application', 1)
          else:
              for line in perms.splitlines():
                  if line.strip() and line.strip() not in s:
                      s = s.replace('    <application', line + '\n    <application', 1)

          # --- application hardening --------------------------------------
          s = re.sub(r'android:label="[^"]*"',
                     'android:label="Al Quran - Tafsir (Scientific)"', s, count=1)
          # No cloud backup / device transfer of app data (53 MB research DB).
          s = s.replace('<application',
                        '<application\n        android:allowBackup="false"\n'
                        '        android:fullBackupContent="false"\n'
                        '        android:dataExtractionRules="@xml/data_extraction_rules"\n'
                        '        android:supportsRtl="true"\n'
                        '        android:enableOnBackInvokedCallback="true"', 1)
          # Block cleartext HTTP; the network security config enforces it too.
          if 'android:usesCleartextTraffic' not in s:
              s = s.replace('<application',
                            '<application\n        android:usesCleartextTraffic="false"\n'
                            '        android:networkSecurityConfig="@xml/network_security_config"', 1)

          # Old Mali/Adreno drivers occasionally render a black frame with
          # Impeller; Skia is plenty for a text-first reader.
          if 'EnableImpeller' not in s:
              s = s.replace(
                  '    </application>',
                  '        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n    </application>',
              )
          app.write_text(s)
          print('manifest hardened')
          for key in ('allowBackup="false"', 'usesCleartextTraffic="false"',
                      'networkSecurityConfig', 'dataExtractionRules',
                      'android.permission.INTERNET', 'android.permission.POST_NOTIFICATIONS',
                      'android.permission.RECEIVE_BOOT_COMPLETED', '<queries>'):
              assert key in s, key
          print('all manifest assertions passed')
          PY

      - name: Add network security + data extraction rules
        working-directory: flutter
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <!-- HTTPS only: audio/video streams and image fetches must never fall back to HTTP. -->
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          XML
          cat > android/app/src/main/res/xml/data_extraction_rules.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <!-- Keep the offline research database and reading progress private. -->
              <cloud-backup>
                  <exclude domain="root" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" path="." />
              </device-transfer>
          </data-extraction-rules>
          XML
          ls -l android/app/src/main/res/xml/

      - name: Harden release build (keep plugin classes, no full-mode R8)
        working-directory: flutter
        run: |
          python3 - <<'PY'
          import pathlib
          g = pathlib.Path('android/gradle.properties')
          s = g.read_text()
          if 'android.enableR8.fullMode' not in s:
              g.write_text(s.rstrip() + '\nandroid.enableR8.fullMode=false\n')
          pathlib.Path('android/app/proguard-rules.pro').write_text(
              '-keep class io.flutter.plugins.sharedpreferences.** { *; }\n'
              '-keep class androidx.datastore.** { *; }\n'
              '-keep class com.dexterous.flutterlocalnotifications.** { *; }\n'
              '-keep class io.flutter.plugins.sqflite.** { *; }\n'
              '# Pigeon ProxyApi calls these from Dart via JNI using hard-coded\n'
              '# signatures that contain kotlin.coroutines.Continuation - R8 must\n'
              '# never rename the class or the lookup fails with NoSuchMethodError.\n'
              '-keepnames class kotlin.coroutines.Continuation\n'
              '-keep class kotlin.coroutines.** { *; }\n'
          )
          p = pathlib.Path('android/app/build.gradle.kts')
          kts = p.exists()
          if not kts:
              p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          # url_launcher's JavaDoc trips a lint CommentDetector crash on this
          # AGP/lint pair (NoSuchMethodError: List.removeLast). Release lint is
          # not part of the quality gate here (flutter analyze + tests are),
          # and a crashing analyzer must not block shipping a signed APK.
          if kts and 'checkReleaseBuilds' not in s:
              s = s.replace(
                  'android {',
                  'android {\n'
                  '    lint {\n'
                  '        checkReleaseBuilds = false\n'
                  '        abortOnError = false\n'
                  '        disable += setOf("EasterEgg", "StopShip")\n'
                  '    }',
                  1,
              )
          elif not kts and 'checkReleaseBuilds' not in s:
              s = s.replace(
                  'android {',
                  'android {\n'
                  '    lintOptions {\n'
                  '        checkReleaseBuilds false\n'
                  '        abortOnError false\n'
                  '        disable \'EasterEgg\', \'StopShip\'\n'
                  '    }',
                  1,
              )
          if kts:
              s = s.replace(
                  'release {',
                  'release {\n'
                  '            isMinifyEnabled = false\n'
                  '            isShrinkResources = false\n'
                  '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                  1,
              )
          else:
              s = s.replace(
                  'release {',
                  'release {\n'
                  '            minifyEnabled false\n'
                  '            shrinkResources false\n'
                  "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'",
                  1,
              )
          p.write_text(s)
          print('minify disabled in', p)
          PY
          grep -n "checkReleaseBuilds\|MinifyEnabled\|minifyEnabled\|enableR8" android/app/build.gradle* android/gradle.properties

      - name: Enable core-library desugaring (required by flutter_local_notifications)
        working-directory: flutter
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          kts = p.exists()
          if not kts:
              p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          if 'coreLibraryDesugaring' in s:
              print('desugaring already enabled')
              raise SystemExit(0)
          if 'compileOptions {' not in s:
              print('!! compileOptions block not found in', p)
              raise SystemExit(1)
          if kts:
              s = s.replace('compileOptions {',
                            'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              dep = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")'
          else:
              s = s.replace('compileOptions {',
                            'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              dep = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
          s = s.rstrip() + '\n\ndependencies {\n' + dep + '\n}\n'
          p.write_text(s)
          print('patched', p)
          print(s)
          EOF

      - name: Add notification receivers to the manifest
        working-directory: flutter
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'ScheduledNotificationReceiver' not in s:
              recv = (
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                  '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
              )
              s = s.replace('    </application>', recv + '    </application>')
              p.write_text(s)
          print('receivers present:', 'ScheduledNotificationReceiver' in p.read_text())
          EOF

      - name: flutter analyze
        working-directory: flutter
        run: flutter pub get && flutter analyze --no-fatal-infos

      - name: Generate launcher icons (emblem from assets/icon.png)
        working-directory: flutter
        run: dart run flutter_launcher_icons

      - name: flutter test (if any)
        working-directory: flutter
        run: flutter test --no-pub

      - name: Pin release signing key (stable across builds)
        working-directory: flutter
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import base64, os, pathlib
          b64 = os.environ.get('ANDROID_KEYSTORE_BASE64', '').strip()
          if not b64:
              print('!! ANDROID_KEYSTORE_BASE64 missing - refusing to build an unsigned release APK')
              raise SystemExit(1)
          ks = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release.p12'
          ks.write_bytes(base64.b64decode(b64))
          pw = os.environ['ANDROID_KEYSTORE_PASSWORD']
          alias = os.environ['ANDROID_KEY_ALIAS']
          kp = os.environ['ANDROID_KEY_PASSWORD']
          if not pw or not alias or not kp:
              print('!! keystore credentials incomplete')
              raise SystemExit(1)
          p = pathlib.Path('android/app/build.gradle.kts')
          kts = p.exists()
          if not kts:
              p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          if 'create("release")' in s or 'signingConfigs.release' in s:
              print('release signing already configured')
              raise SystemExit(0)
          if kts:
              block = (
                  '    signingConfigs {\n'
                  '        create("release") {\n'
                  f'            storeFile = file("{ks}")\n'
                  '            storeType = "PKCS12"\n'
                  f'            storePassword = "{pw}"\n'
                  f'            keyAlias = "{alias}"\n'
                  f'            keyPassword = "{kp}"\n'
                  '        }\n'
                  '    }\n'
              )
              s = s.replace('android {', 'android {\n' + block, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
          else:
              block = (
                  '    signingConfigs {\n'
                  '        release {\n'
                  f'            storeFile file("{ks}")\n'
                  '            storeType "PKCS12"\n'
                  f'            storePassword "{pw}"\n'
                  f'            keyAlias "{alias}"\n'
                  f'            keyPassword "{kp}"\n'
                  '        }\n'
                  '    }\n'
              )
              s = s.replace('android {', 'android {\n' + block, 1)
              s = s.replace('signingConfig signingConfigs.debug',
                            'signingConfig signingConfigs.release')
          p.write_text(s)
          print('release signing wired into', p)
          EOF

      - name: Build release APK (split per ABI, lightweight)
        working-directory: flutter
        run: |
          flutter build apk --release --split-per-abi --no-shrink
          ls -la build/app/outputs/flutter-apk/

      - name: Verify release signing + zip alignment
        working-directory: flutter
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          ZIPALIGN=$(ls "$SDK"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found in $SDK"; exit 1; }
          [ -n "$ZIPALIGN" ] || { echo "zipalign not found in $SDK"; exit 1; }
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "== $apk =="
            "$APKSIGNER" verify --print-certs --verbose "$apk" | sed -n '1,12p'
            if "$APKSIGNER" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "!! $apk is debug-signed - refusing to publish"
              exit 1
            fi
            "$ZIPALIGN" -c -v 4 "$apk" | tail -2
          done

      - name: Verify Pigeon/JNI plugin signatures survived (guard against R8 renaming Continuation)
        working-directory: flutter
        run: |
          python3 - <<'PY'
          import struct, sys, zipfile

          def uleb(b, o):
              v = s = 0
              while True:
                  c = b[o]; o += 1; v |= (c & 0x7F) << s
                  if not (c & 0x80):
                      break
                  s += 7
              return v, o

          WANTED = {
              'Lio/flutter/plugins/sharedpreferences/SharedPreferencesApiRegistrar;',
              'Lio/flutter/plugins/sharedpreferences/LegacySharedPreferencesPlugin;',
          }
          REQ = 'Lkotlin/coroutines/Continuation;'

          def check(apk):
              bad = []
              z = zipfile.ZipFile(apk)
              for name in sorted(x for x in z.namelist() if x.startswith('classes') and x.endswith('.dex')):
                  d = z.read(name)
                  g = lambda off: struct.unpack_from('<I', d, off)[0]
                  str_off, typ_off, proto_off, meth_off, cls_off = g(60), g(68), g(76), g(92), g(100)
                  typ_n, meth_n, cls_n = g(64), g(88), g(96)
                  def st(i):
                      o = g(str_off + i * 4); _, o = uleb(d, o)
                      return d[o:d.index(b'\x00', o)].decode('utf8', 'replace')
                  types = [st(g(typ_off + i * 4)) for i in range(typ_n)]
                  def desc(pi):
                      ret = types[g(proto_off + pi * 12 + 4)]
                      p = g(proto_off + pi * 12 + 8)
                      ps = [types[struct.unpack_from('<H', d, p + 4 + i * 2)[0]] for i in range(g(p))] if p else []
                      return f"({''.join(ps)}){ret}"
                  meth = {}
                  for i in range(meth_n):
                      ci, pi = struct.unpack_from('<HH', d, meth_off + i * 8)
                      meth[i] = (types[ci], st(g(meth_off + i * 8 + 4)), desc(pi))
                  for c in range(cls_n):
                      t = types[g(cls_off + c * 32)]
                      if t not in WANTED:
                          continue
                      data = g(cls_off + c * 32 + 24)
                      if not data:
                          continue
                      o = data
                      nsf, o = uleb(d, o); nif, o = uleb(d, o); ndm, o = uleb(d, o); nvm, o = uleb(d, o)
                      for _ in range(nsf + nif):
                          _, o = uleb(d, o); _, o = uleb(d, o)
                      for sect, nn in (('direct', ndm), ('virtual', nvm)):
                          mi = 0
                          for _ in range(nn):
                              dd, o = uleb(d, o); mi += dd; acc, o = uleb(d, o); code, o = uleb(d, o)
                              _, cn, cd = meth[mi]
                              if cn == 'getAll' and sect == 'virtual':
                                  short = t.split('/')[-1][:-1]
                                  if REQ not in cd or not code:
                                      bad.append(f'{short}.getAll{cd}')
                                  else:
                                      print(f'  OK {short}.getAll{cd}')
              return bad

          import glob
          all_bad = []
          for apk in sorted(glob.glob('build/app/outputs/flutter-apk/*-release.apk')):
              print(apk)
              all_bad += check(apk)
          if all_bad:
              print('BROKEN JNI signatures (R8 renamed kotlin.coroutines.Continuation?):')
              for b in all_bad:
                  print('  ', b)
              sys.exit(1)
          print('all Pigeon/JNI getAll signatures intact')
          PY

      - name: Upload pubspec.lock (dependency pinning)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pubspec-lock
          path: flutter/pubspec.lock
          retention-days: 5

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quran-tafsir-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/*release*.apk
          retention-days: 30

      - name: Attach API-level info
        run: echo "minSdk=29 (Android 10) · targetSdk=35 · HTTPS-only · backup disabled"

      - name: Attach to GitHub Release
        if: inputs.release_tag != '' || github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: flutter/build/app/outputs/flutter-apk/*release*.apk
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
