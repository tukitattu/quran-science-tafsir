name: Flutter APK (Android 10 → latest)

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.0.0) — leave empty for artifact-only build'
        required: false
        default: ''
  release:
    types: [created]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor (short)
        run: flutter doctor -v

      - name: Generate Android platform (minSdk 29 — Android 10)
        working-directory: flutter
        run: |
          flutter create . --platforms android --org com.etside --project-name quran_tafsir 2>&1 | tail -3
          # Android 10 floor (gradle DSL differs across AGP versions; handle both syntaxes)
          f=android/app/build.gradle.kts && [ -f "$f" ] || f=android/app/build.gradle
          sed -i "s/minSdk = .*/minSdk = 29/; s/minSdkVersion .*/minSdkVersion 29/" "$f"
          grep -n "minSdk" "$f"

      - name: Patch permissions + app label (notifications, alarms, boot)
        working-directory: flutter
        run: |
          f=android/app/src/main/AndroidManifest.xml
          python3 - "$f" <<'EOF'
          import sys, pathlib, re
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          add = (
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
          )
          if 'POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', add + '    <application')
          s = re.sub(r'android:label="[^"]*"', 'android:label="Al Quran - Scientific Tafsir"', s, count=1)
          # Old Mali/Adreno drivers occasionally render a black frame with
          # Impeller; Skia is plenty for a text-first reader.
          if 'EnableImpeller' not in s:
              s = s.replace(
                  '    </application>',
                  '        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n    </application>',
              )
          p.write_text(s)
          print('manifest label patched:', 'Al Quran - Scientific Tafsir' in p.read_text())
          EOF

      - name: Enable core-library desugaring (required by flutter_local_notifications)
        working-directory: flutter
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          kts = p.exists()
          if not kts:
              p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          if 'coreLibraryDesugaring' in s:
              print('desugaring already enabled')
              raise SystemExit(0)
          if 'compileOptions {' not in s:
              print('!! compileOptions block not found in', p)
              raise SystemExit(1)
          if kts:
              s = s.replace('compileOptions {',
                            'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              dep = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")'
          else:
              s = s.replace('compileOptions {',
                            'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              dep = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'"
          s = s.rstrip() + '\n\ndependencies {\n' + dep + '\n}\n'
          p.write_text(s)
          print('patched', p)
          print(s)
          EOF

      - name: Add notification receivers to the manifest
        working-directory: flutter
        run: |
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'ScheduledNotificationReceiver' not in s:
              recv = (
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                  '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n'
              )
              s = s.replace('    </application>', recv + '    </application>')
              p.write_text(s)
          print('receivers present:', 'ScheduledNotificationReceiver' in p.read_text())
          EOF

      - name: flutter analyze
        working-directory: flutter
        run: flutter pub get && flutter analyze --no-fatal-infos

      - name: Generate launcher icons (emblem from assets/icon.png)
        working-directory: flutter
        run: dart run flutter_launcher_icons

      - name: flutter test (if any)
        working-directory: flutter
        run: flutter test --no-pub || echo "no tests"

      - name: Build release APK (split per ABI, lightweight)
        working-directory: flutter
        run: |
          flutter build apk --release --split-per-abi
          ls -la build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-tafsir-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/*release*.apk
          retention-days: 30

      - name: Attach API-level info
        run: echo "minSdk=29 (Android 10) · targetSdk=35 — supports Android 10 through 15+"

      - name: Attach to GitHub Release
        if: inputs.release_tag != '' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: flutter/build/app/outputs/flutter-apk/*release*.apk
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
