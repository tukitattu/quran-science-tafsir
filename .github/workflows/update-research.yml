name: Daily Research Update

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Fetch latest sources
        run: |
          python scripts/update_research.py --daily
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Commit & Push (if changed)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "tafsir-bot"
          git config user.email "bot@etside.github.io"
          git add assets/data/deep_research.js assets/data/surah_knowledge.js assets/data/alt_meanings.json 2>/dev/null || true
          git add scripts/update_log.json 2>/dev/null || true
          git commit -m "Daily research update: $(date -u +%Y-%m-%d) — alternative meanings & translations" || true
          git push origin main

      - name: Trigger APK build (if updated)
        if: steps.changes.outputs.changed == 'true'
        run: |
          gh workflow run flutter-apk.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
