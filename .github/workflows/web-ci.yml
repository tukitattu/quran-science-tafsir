name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'chapters/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.html'
      - '*.js'
      - '*.json'
      - '*.xml'
      - '*.txt'
      - 'sw.js'
      - '.github/workflows/web-ci.yml'
  pull_request:
  workflow_dispatch:

# Read-only: this workflow validates, it never publishes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate data bundle
        run: python3 scripts/validate_data.py

      - name: Compile every script
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          echo "python scripts compile"

      - name: Check every JavaScript file
        run: |
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          find assets/data -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          echo "javascript syntax ok"

      - name: Parse every JSON file
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              if '.git' in p.parts or 'node_modules' in p.parts:
                  continue
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append(f'{p}: {exc}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('all JSON parses')
          PY

  smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.49.0
          python3 -m playwright install --with-deps chromium

      - name: Serve the static site
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8099/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/ >/dev/null || exit 1

      - name: Browser smoke test
        env:
          SMOKE_BASE: http://127.0.0.1:8099
        run: python3 tests/web_smoke.py

      - name: Verify no insecure or dead references
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              for m in re.finditer(r'http://[^\s"\'<>)]+', text):
                  if not m.group(0).startswith('http://www.w3.org/'):
                      bad.append(f'{p}: {m.group(0)}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('no insecure http:// references in HTML')
          PY
